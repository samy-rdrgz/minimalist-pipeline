# Every push and pull request: the addon's tests, without Blender (a fake
# bpy, tools/fake_bpy.py). Python 3.11, Blender 4.2's.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/run_tests.py
