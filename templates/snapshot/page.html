<header class="topbar">
  <button class="btn flat icon only-narrow" id="out-toggle" aria-label="Show the outliner" title="Outliner"><svg class="i"><use href="#b-outliner"/></svg></button>
  <div class="brand"><b id="p-name"></b></div><span class="live only-wide live-only" id="p-live" title="Connected to Blender"><i></i>live</span>
  <div class="tools" id="tools">
  <div class="anchor view-a">
    <button class="btn flat tb" data-menu="m-view" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu"><svg class="i vic tbi"><use href="#b-preferences"/></svg><span class="lbl" data-t>Menu</span></button>
    <div class="menu right" id="m-view" hidden role="menu">
      <label class="mi" role="menuitem"><svg class="i"><use href="#b-import"/></svg><span class="lbl" data-t>Load a review…</span><input type="file" class="rv-load" accept=".json,application/json" hidden></label>
      <button class="mi" role="menuitem" data-act="videos"><svg class="i"><use href="#b-file_folder"/></svg><span class="lbl" data-t>Choose the videos folder…</span></button>
      <button class="mi live-only" role="menuitem" data-act="share"><svg class="i"><use href="#b-community"/></svg><span class="lbl" data-t>Share with a phone…</span></button>
      <button class="mi" role="menuitem" data-bulk id="m-bulk" hidden title="Make a department required, or not, on several files"><svg class="i"><use href="#b-preferences"/></svg><span class="lbl" data-t>Required departments on several files…</span></button>
      <button class="mi live-only" role="menuitem" data-act="snapshot"><svg class="i"><use href="#b-export"/></svg><span class="lbl" data-t>Export a snapshot…</span><span class="k" data-t>in Blender</span></button>
      <div class="msep"></div>
      <div class="menu-h" data-t>Interface scale</div>
      <div class="mi scale-r"><input type="range" id="scale-in" min="0.5" max="1.5" step="0.125" value="1" list="scale-ticks" aria-label="Interface scale"><span class="k" id="scale-v">1.00</span></div>
      <datalist id="scale-ticks"><option value="0.5"></option><option value="0.625"></option><option value="0.75"></option><option value="0.875"></option><option value="1"></option><option value="1.125"></option><option value="1.25"></option><option value="1.375"></option><option value="1.5"></option></datalist>
      <button class="mi" role="menuitem" data-act="collapse"><span class="lbl" data-t>Fold the sequences</span></button>
      <button class="mi" role="menuitem" data-act="expand"><span class="lbl" data-t>Unfold the sequences</span></button>
      <div class="msep"></div><div class="menu-h" data-t>Theme</div>
      <button class="mi" role="menuitem" data-theme="dark"><span class="lbl" data-t>Dark</span><span class="k">blue</span></button>
      <button class="mi" role="menuitem" data-theme="light"><span class="lbl" data-t>Light</span><span class="k">blue</span></button>
      <button class="mi" role="menuitem" data-theme="system"><span class="lbl" data-t>System</span></button>
      <div class="msep"></div><div class="menu-h" data-t>Language</div>
      <button class="mi" role="menuitem" data-lang=""><span class="lbl" data-t>Automatic</span><span class="k" data-t>Blender's, else the browser's</span></button>
      <button class="mi" role="menuitem" data-lang="en"><span class="lbl">English</span></button>
      <button class="mi" role="menuitem" data-lang="fr"><span class="lbl">Français</span></button>
      <div class="msep"></div><button class="mi" role="menuitem" data-tourstart><span class="lbl" data-t>Guided tour</span></button>
    </div>
  </div>
  <div class="anchor live-only"><button class="btn flat tb" id="news-b" aria-label="What's new" title="What's new since the page opened"><svg class="i tbi"><use href="#i-bell"/></svg><span class="lbl" data-t>What's new</span><span class="cnt" hidden>0</span></button></div>
